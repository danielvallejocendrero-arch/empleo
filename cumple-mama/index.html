<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Feliz 60, Mamá!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Lato:wght@300;400&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --oro: #e8c27a;
    --oro-claro: #f7e2b5;
    --rosa: #f4a7b9;
    --noche: #0b1626;
    --noche-2: #1d3554;
    --texto: #fff8ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at top, var(--noche-2), var(--noche) 70%);
    color: var(--texto);
    font-family: 'Lato', sans-serif;
  }
  canvas#fx { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

  /* ---------- Pantalla de inicio ---------- */
  #inicio {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 24px 16px; z-index: 10; transition: opacity 1.2s ease, transform 1.2s ease;
  }
  #inicio.salir { opacity: 0; transform: scale(1.08); pointer-events: none; }
  .saludo {
    font-family: 'Great Vibes', cursive; font-size: clamp(2.6rem, 9vw, 5.5rem);
    color: var(--oro-claro); text-shadow: 0 0 24px rgba(232,194,122,.45);
    opacity: 0; animation: aparecer 1.6s .3s forwards;
  }
  .sesenta {
    font-family: 'Playfair Display', serif; font-weight: 700;
    font-size: clamp(7rem, 30vw, 15rem); line-height: 1;
    background: linear-gradient(120deg, #b8862f, var(--oro-claro) 40%, #fff 50%, var(--oro-claro) 60%, #b8862f);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    opacity: 0; animation: aparecer 1.6s .9s forwards, brillo 5s 2s linear infinite;
    filter: drop-shadow(0 6px 30px rgba(232,194,122,.35));
  }
  .subtitulo {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: clamp(1.05rem, 3.6vw, 1.5rem); max-width: 34ch; margin-top: 10px;
    opacity: 0; animation: aparecer 1.6s 1.6s forwards; color: #eef3fa;
  }
  #empezar {
    margin-top: 42px; position: relative; border: none; cursor: pointer;
    font-family: 'Playfair Display', serif; font-size: 1.2rem; letter-spacing: .04em;
    color: var(--noche); padding: 18px 40px; border-radius: 999px;
    background: linear-gradient(135deg, var(--oro-claro), var(--oro) 50%, var(--rosa));
    box-shadow: 0 10px 40px rgba(244,167,185,.35), inset 0 -3px 0 rgba(0,0,0,.12);
    opacity: 0; animation: aparecer 1.2s 2.4s forwards, latido 2.4s 3.6s ease-in-out infinite;
    transition: transform .25s ease;
    overflow: hidden;
  }
  #empezar::before {
    content: ''; position: absolute; inset: -6px; border-radius: inherit; z-index: -1;
    border: 2px solid var(--oro); opacity: .6; animation: onda 2.4s 3.6s ease-out infinite;
  }
  #empezar::after {
    content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent);
    transform: skewX(-20deg); animation: destello 3.5s 4s ease-in-out infinite;
  }
  #empezar:hover { transform: scale(1.06); }
  #empezar:active { transform: scale(.97); }
  .pista { margin-top: 18px; font-size: .85rem; opacity: 0; animation: aparecer 1s 3.2s forwards; color: #b9c6d8; }

  @keyframes aparecer { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes brillo { to { background-position: -250% 0; } }
  @keyframes latido { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes onda { from { transform: scale(1); opacity: .7; } to { transform: scale(1.35); opacity: 0; } }
  @keyframes destello { 0%,60% { left: -60%; } 100% { left: 130%; } }

  /* ---------- Viaje: una mesa donde van cayendo las fotos ---------- */
  #viaje { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 1.5s ease; overflow: hidden; }
  #viaje.activo { opacity: 1; pointer-events: auto; }
  .fondo {
    position: absolute; inset: -40px; background-size: cover; background-position: center;
    filter: blur(28px) brightness(.38); opacity: 0; transition: opacity 1.1s ease;
  }
  .fondo.on { opacity: 1; }
  .fondo.azul { inset: 0; filter: none; opacity: 1; background: radial-gradient(ellipse at 50% 30%, var(--noche-2), var(--noche) 75%); }
  /* trama de puntos, como el papel de los cómics */
  .trama { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 1.2px, transparent 1.6px); background-size: 7px 7px; }

  #mesa { position: absolute; left: 0; right: 0; top: 58px; bottom: 150px; }
  .esc { position: absolute; inset: 0; transition: opacity 1.1s ease; }
  .esc.sale { opacity: 0; }

  /* marco blanco de foto revelada */
  .foto {
    display: block; box-sizing: border-box; background: #fffdf7; object-fit: contain;
    border: 8px solid #fffdf7; border-bottom-width: 26px; box-shadow: 0 16px 36px rgba(0,0,0,.55);
    opacity: 0; transform: rotate(var(--rot, 0deg));
  }
  .cae { animation: aterriza 1.3s cubic-bezier(.25,.8,.3,1) forwards; }
  @keyframes aterriza {
    0% { opacity: 0; transform: rotate(calc(var(--rot, 0deg) + 4deg)) translateY(-14px) scale(1.07); }
    100% { opacity: 1; transform: rotate(var(--rot, 0deg)) scale(1); }
  }

  /* una foto sola */
  .esc.unica { display: flex; align-items: center; justify-content: center; padding: 0 12px; }
  .pieza { position: relative; opacity: 0; transform: rotate(var(--rot)); }
  .pieza .foto { opacity: 1; transform: none; max-width: min(88vw, 680px); max-height: calc(100vh - 260px); }
  .pieza.cae { animation: aterriza 1.3s cubic-bezier(.25,.8,.3,1) forwards; }
  /* las importantes aparecen despacio, como revelándose, y luego se acercan un poco */
  .pieza.destacada { animation: revela 2.6s ease-out forwards, acerca 14s 2.6s ease-out forwards; }
  .pieza.destacada .foto { filter: sepia(.4) brightness(.8) blur(2px); transition: filter 3s ease .4s; }
  .pieza.destacada.lista .foto { filter: none; }
  @keyframes revela { from { opacity: 0; transform: rotate(var(--rot)) scale(.94); } to { opacity: 1; transform: rotate(var(--rot)) scale(1); } }
  @keyframes acerca { from { opacity: 1; transform: rotate(var(--rot)) scale(1); } to { opacity: 1; transform: rotate(var(--rot)) scale(1.05); } }

  /* varias fotos a la vez, grandes y juntas en el centro */
  .esc.grupo { display: grid; gap: 14px; padding: 4px 14px; grid-template: 1fr 1fr / 1fr; max-width: 1100px; margin: 0 auto; }
  .esc.grupo.n1 { grid-template: 1fr / 1fr; }
  .esc.grupo.n3 { grid-template: "a a" 1.25fr "b c" 1fr / 1fr 1fr; }
  .esc.grupo.n3 .celda:first-child { grid-area: a; }
  .esc.grupo.n4 { grid-template: 1fr 1fr / 1fr 1fr; }
  .celda { display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
  .celda .foto { max-width: 100%; max-height: 100%; }
  /* en el móvil (vertical) */
  .n2 .celda:nth-child(1) { align-items: flex-end; }  .n2 .celda:nth-child(2) { align-items: flex-start; }
  .n3 .celda:nth-child(1) { align-items: flex-end; }
  .n3 .celda:nth-child(2) { align-items: flex-start; justify-content: flex-end; }
  .n3 .celda:nth-child(3) { align-items: flex-start; justify-content: flex-start; }
  .n4 .celda:nth-child(odd) { justify-content: flex-end; }  .n4 .celda:nth-child(even) { justify-content: flex-start; }
  .n4 .celda:nth-child(-n+2) { align-items: flex-end; }   .n4 .celda:nth-child(n+3) { align-items: flex-start; }
  /* en pantallas apaisadas, en fila */
  @media (min-aspect-ratio: 1/1) {
    .esc.grupo { grid-template: 1fr / 1fr 1fr; }
    .esc.grupo.n3 { grid-template: "a b c" 1fr / 1fr 1fr 1fr; }
    .esc.grupo.n4 { grid-template: 1fr 1fr / 1fr 1fr; }
    .n2 .celda { align-items: center; }
    .n2 .celda:nth-child(1) { justify-content: flex-end; }  .n2 .celda:nth-child(2) { justify-content: flex-start; }
    .n3 .celda { align-items: center !important; }
    .n3 .celda:nth-child(1) { justify-content: flex-end; } .n3 .celda:nth-child(2) { justify-content: center; } .n3 .celda:nth-child(3) { justify-content: flex-start; }
  }

  /* el camino: todas las fotos de los niños en un solo plano, en zigzag, de pequeños a mayores */
  .esc.camino svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .esc.camino polyline { fill: none; stroke: rgba(255,246,216,.45); stroke-width: 3; stroke-dasharray: 8 9; stroke-linecap: round; }
  .paso { position: absolute; transform: translate(-50%, -50%); }
  .paso .foto { border-width: 5px; border-bottom-width: 15px; }

  /* sello de pasaporte (guiño a un viaje) */
  .sello {
    position: absolute; right: -10px; top: 18px; padding: 6px 12px; border: 3px double #c0392b; border-radius: 6px;
    color: #c0392b; font-family: 'Playfair Display', serif; font-weight: 700; letter-spacing: .12em; font-size: 1.05rem;
    background: rgba(255,253,247,.75); opacity: 0; transform: rotate(-14deg);
  }
  .sello.ver { animation: sellar .35s ease-in forwards; }
  @keyframes sellar { from { opacity: 0; transform: rotate(-14deg) scale(3); } to { opacity: .9; transform: rotate(-14deg) scale(1); } }

  /* cartela de narrador, como en las viñetas */
  .cartela {
    background: #fff6d8; color: #1a2232; border: 3px solid #111; box-shadow: 6px 6px 0 #111;
    padding: 12px 16px; opacity: 0; transform: rotate(-1.2deg); max-width: 520px;
  }
  .cartela p { font-family: 'Caveat', cursive; font-weight: 600; font-size: clamp(1.4rem, 5.4vw, 1.85rem); line-height: 1.2; }
  .cartela.ver { animation: vineta .4s cubic-bezier(.2,.9,.3,1.4) forwards; }
  .cartela.sale { opacity: 0; animation: none; }
  @keyframes vineta { from { opacity: 0; transform: rotate(-1.2deg) scale(.5); } to { opacity: 1; transform: rotate(-1.2deg) scale(1); } }
  #narrador { position: absolute; left: 16px; right: 16px; bottom: 26px; margin: 0 auto; }
  .l { opacity: 0; transition: opacity .1s; }
  .l.on { opacity: 1; }

  /* frase puente entre etapas: solo la cartela, grande y centrada */
  #puente { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 16px; opacity: 0; transition: opacity .6s ease; pointer-events: none; }
  #puente.on { opacity: 1; }
  #puente .cartela { transform: rotate(-2deg); padding: 16px 22px; }
  #puente .cartela p { font-size: clamp(2rem, 8.5vw, 2.8rem); }

  .controles { position: fixed; top: 14px; right: 14px; z-index: 7; display: flex; gap: 8px; }
  .controles { opacity: .45; transition: opacity .3s; }
  .controles:hover { opacity: 1; }
  .controles button {
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3);
    background: rgba(11,22,38,.55); color: var(--texto); font-size: 1.1rem; cursor: pointer; backdrop-filter: blur(6px);
  }

  /* ---------- Final ---------- */
  #final {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px 16px; opacity: 0; pointer-events: none; transition: opacity 2s ease; z-index: 8;
    background: radial-gradient(ellipse at center, rgba(29,53,84,.92), rgba(11,22,38,.98));
  }
  #final.activo { opacity: 1; pointer-events: auto; }
  #final h2 { font-family: 'Great Vibes', cursive; font-weight: 400; font-size: clamp(2.6rem, 9vw, 5rem); color: var(--oro-claro); }
  #final p { font-family: 'Playfair Display', serif; font-style: italic; font-size: clamp(1.05rem, 3.6vw, 1.4rem); max-width: 36ch; margin-top: 14px; line-height: 1.5; }
  #final .firma { font-family: 'Great Vibes', cursive; font-size: 2rem; color: var(--rosa); margin-top: 18px; font-style: normal; }
  #otraVez { margin-top: 34px; background: transparent; border: 1px solid var(--oro); color: var(--oro-claro); padding: 12px 28px; border-radius: 999px; font-family: 'Lato', sans-serif; cursor: pointer; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<canvas id="fx"></canvas>

<section id="inicio">
  <div class="saludo">¡Felicidades, Mamá!</div>
  <div class="sesenta">60</div>
  <p class="subtitulo">Sesenta años llenando de luz todo lo que tocas</p>
  <button id="empezar">✨ Comienza el viaje ✨</button>
  <div class="pista">Sube el volumen 🎶</div>
</section>

<section id="viaje">
  <div class="fondo azul"></div>
  <div class="fondo" id="fondo0"></div><div class="fondo" id="fondo1"></div>
  <div class="trama"></div>
  <div id="mesa"></div>
  <div id="narrador" class="cartela"><p></p></div>
  <div id="puente"><div class="cartela"><p></p></div></div>
  <div class="controles">
    <button id="btnPausa" title="Pausar">❚❚</button>
    <button id="btnSonido" title="Silenciar">🔊</button>
  </div>
</section>

<section id="final">
  <h2>¡Feliz cumpleaños!</h2>
  <p id="mensajeFinal"></p>
  <p class="firma" id="firma"></p>
  <button id="otraVez">↺ Ver de nuevo</button>
</section>

<audio id="musica" preload="auto"></audio>

<script>
/* =====================================================================
   PERSONALIZA AQUÍ
   - Fotos en "fotos/" y la canción en "musica/".
   - La historia es una lista de escenas:
       { puente: '...' }                                 frase grande entre una etapa y otra
       { foto: 'fotos/x.jpg', texto: '...' }             una foto sola
       { foto: ..., destacar: true }                      foto importante: aparece despacio
       { grupo: ['fotos/a.jpg', ...], texto: '...' }      2, 3 o 4 fotos a la vez
       { camino: ['fotos/a.jpg', ...], textos: [...] }    todas a la vez en zigzag, como un camino
     Con  textos: ['...', '...']  la frase va cambiando durante la escena.
     Si una escena no lleva frase, se queda la anterior.
   - Duración en tiempos de la canción (138 bpm → 1 tiempo ≈ 0,43 s): t: 10
   ===================================================================== */
const CONFIG = {
  cancion: 'musica/cancion.mp3', // Viva la Vida - Coldplay
  bpm: 138,
  primerTiempo: 0.785, // segundo exacto del primer golpe de la canción
  tiempos: { puente: 7, foto: 8, fotoSinTexto: 5, porFoto: 3 },
  mensajeFinal: 'Gracias por cada abrazo, cada beso y cada sonrisa. Todo lo bonito que tenemos es gracias a ti.',
  firma: 'Tu familia',
  historia: [
    // 1 · La infancia: despacio, con los abuelos
    { puente: 'Érase una vez…' },
    { foto: 'fotos/bebe-mama.jpg', texto: '…una niña que llegó a una familia que la quería con locura…', destacar: true, t: 16 },
    { foto: 'fotos/con-mama.jpg', texto: '…con una madre de cariño infinito…', destacar: true, t: 16 },
    { foto: 'fotos/con-papa.jpg', texto: '…un padre con dos niñas preciosas…', destacar: true, t: 16 },
    { foto: 'fotos/infancia.jpg', texto: '…y una hermana que estaba todos los días para cuidarla, y ella a su hermana… aunque se metiera en líos.', destacar: true, t: 15 },

    // 2 · La juventud
    { puente: 'Y la niña fue creciendo…' },
    { grupo: ['fotos/mirador.jpg', 'fotos/acantilado.jpg', 'fotos/banco.jpg', 'fotos/fiesta.jpg'], t: 20,
      textos: ['Esa niña eras tú. Fuiste conociendo gente nueva, divirtiéndote cada vez más…', '…y descubriendo poco a poco lo que te gustaba y lo que no.'] },
    { foto: 'fotos/paris.jpg', texto: 'Y ese famoso viaje inesperado a París…', sello: 'PARÍS ✈', destacar: true, t: 12 },

    // 3 · Papá
    { foto: 'fotos/novios-noche.jpg', texto: 'Hasta que, sin esperarlo, apareció un sueco en Bustarviejo…', destacar: true, t: 13 },
    { grupo: ['fotos/novios-laguna.jpg', 'fotos/novios-paseo.jpg', 'fotos/novios-elegantes.jpg'], t: 15,
      textos: ['Os fuisteis conociendo…', '…hasta llegar al momento decisivo.'] },
    { foto: 'fotos/boda.jpg', texto: 'El novio y la novia se convirtieron en marido y mujer.', destacar: true, t: 10 },
    { foto: 'fotos/brindis.jpg', t: 3 },
    { foto: 'fotos/novia.jpg', texto: 'Y ese día tú estabas preciosa.', destacar: true, t: 13 },

    // 4 · Llegamos nosotros, y el camino creciendo
    { foto: 'fotos/bebe2.jpg', texto: 'Seguisteis creciendo juntos y al año llegó Paula, una pajarito que se convirtió en el centro del cariño.', destacar: true, t: 14 },
    // cuando llegue la foto del pajarito, la frase se reparte así:
    // { foto: 'fotos/bebe2.jpg', texto: 'Seguisteis creciendo juntos y al año llegó Paula…', destacar: true, t: 11 },
    // { foto: 'fotos/pajarito.jpg', texto: '…una pajarito que se convirtió en el centro del cariño.', destacar: true, t: 11 },
    { foto: 'fotos/bebe.jpg', texto: 'Y como no teníais suficiente y queríais el niño… llegó un regordete.', destacar: true, t: 13 },
    { camino: ['fotos/crecer-biberon.jpg', 'fotos/crecer-navidad.jpg', 'fotos/cumple-bebes.jpg', 'fotos/mama.jpg',
               'fotos/crecer-paseo.jpg', 'fotos/crecer-noche.jpg', 'fotos/crecer-piscina.jpg', 'fotos/deberes.jpg',
               'fotos/crecer-comunion.jpg', 'fotos/crecer-flores.jpg', 'fotos/crecer-comida.jpg'], t: 42,
      textos: ['Así se fue formando la familia…', 'Los niños fueron creciendo, y vosotros con ellos…', 'Llegaron los colegios, los veranos de piscina, las comuniones…'] },

    // 5 · Las amistades
    { foto: 'fotos/mati.jpg', texto: 'En la nueva casa conociste nuevas amistades, como Mati, y vuestros días de mercadillo…', destacar: true, t: 12 },
    { foto: 'fotos/yoli.jpg', texto: '…o Yoli, una mujer con un corazón enorme.', destacar: true, t: 11 },
    { grupo: ['fotos/amigas-santuario.jpg', 'fotos/amigos-norte.jpg'], t: 9, texto: 'Escapadas con amigos…' },
    { grupo: ['fotos/boda-tia.jpg', 'fotos/con-tia.jpg'], t: 9, texto: '…y tu hermana, siempre a tu lado.' },

    // 6 · Viajes en familia
    { grupo: ['fotos/holanda-copa.jpg', 'fotos/holanda-bicis.jpg', 'fotos/amsterdam-padres.jpg'], t: 13,
      texto: 'Y muchos viajes en familia… ¡bebiendo cerveza en Holanda!' },
    { grupo: ['fotos/lanzarote.jpg', 'fotos/playa-noche.jpg', 'fotos/biarritz.jpg', 'fotos/grecia.jpg'], t: 18,
      textos: ['Volcanes en Lanzarote…', '…playas en Valencia…', '…y ruinas en Grecia.'] },
    { foto: 'fotos/estatua.jpg', texto: '…y algún que otro ligue por el camino.', destacar: true, t: 12 },
    { grupo: ['fotos/florencia-duomo.jpg', 'fotos/florencia-catedral.jpg', 'fotos/salou.jpg', 'fotos/menorca.jpg'], t: 13,
      texto: 'Y tantas escapadas más…' },
    { grupo: ['fotos/escapada.jpg', 'fotos/casa-mercedes.jpg'], t: 7 },
    { foto: 'fotos/filomena.jpg', texto: 'Y hasta disfrutamos de la nevada histórica de Madrid.', t: 10 },
    { foto: 'fotos/reforma.jpg', texto: 'Y como siempre, de vez en cuando alguna chapuza teníamos que hacer.', t: 10 },

    // 7 · La familia crece
    { grupo: ['fotos/grad-paula.jpg', 'fotos/grad-dani.jpg'], t: 16,
      textos: ['Llegaron las graduaciones: primero Paula…', '…y después Dani.'] },
    { foto: 'fotos/boda-familia.jpg', texto: 'Y la boda más reciente, la de Álex.' },
    { foto: 'fotos/los-cuatro.jpg', t: 6 },
    { foto: 'fotos/boda-alex-todos.jpg', texto: 'La familia no paraba de crecer, y ahora tenemos nuevos integrantes…', destacar: true, t: 13 },
    { grupo: ['fotos/casa-tia.jpg', 'fotos/comida-familiar.jpg'], t: 8 },
    { grupo: ['fotos/navidad-selfie.jpg', 'fotos/navidad-brindis.jpg', 'fotos/navidad-gato.jpg'], t: 14,
      textos: ['Y las Navidades, cada año…', '…hasta que llegó un nuevo integrante: ¡Aslan!'] },

    // 8 · Hoy
    { foto: 'fotos/aeropuerto-ahora.jpg', texto: 'Ahora los niños ya son mayores: trabajan… y uno hasta se ha ido de casa, un poquito lejos.', t: 12 },
    { grupo: ['fotos/rio.jpg', 'fotos/abrazo.jpg'], t: 13,
      texto: '…pero vosotros seguís siendo los mejores padres, como desde el primer día.' },
    { foto: 'fotos/hoy.jpg', texto: 'Y ahora, 60 añitos… y lo mejor está por llegar.', destacar: true, t: 16 }
  ]
};
/* ===================================================================== */

const TIEMPO = 60 / CONFIG.bpm, COMPAS = TIEMPO * 4; // segundos por tiempo y por compás

document.getElementById('mensajeFinal').textContent = CONFIG.mensajeFinal;
document.getElementById('firma').textContent = CONFIG.firma ? '— ' + CONFIG.firma : '';

// ---------- Partículas: brillos dorados, corazones y confeti ----------
const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
let W, H, particulas = [];
function ajustar() { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; }
addEventListener('resize', ajustar); ajustar();
const colores = ['#e8c27a', '#f7e2b5', '#f4a7b9', '#ffffff', '#9fc3ea'];
function nueva(tipo, x, y) {
  const d = devicePixelRatio;
  if (tipo === 'brillo') return { tipo, x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.8 + .4) * d, fase: Math.random() * 6.28, vel: Math.random() * .03 + .01, vy: -(Math.random() * .2 + .05) * d };
  if (tipo === 'corazon') return { tipo, x: Math.random() * W, y: H + 20 * d, r: (Math.random() * 8 + 6) * d, vy: -(Math.random() * .7 + .4) * d, osc: Math.random() * 6.28, alfa: Math.random() * .4 + .25 };
  const ang = Math.random() * 6.28, v = (Math.random() * 9 + 4) * d;
  return { tipo: 'confeti', x, y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v - 5 * d, r: (Math.random() * 4 + 3) * d, rot: Math.random() * 6.28, vr: Math.random() * .3 - .15, color: colores[Math.random() * colores.length | 0], vida: 1 };
}
for (let i = 0; i < 90; i++) particulas.push(nueva('brillo'));
let corazones = true;
function dibujaCorazon(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * .3);
  ctx.bezierCurveTo(x, y, x - s * .5, y, x - s * .5, y + s * .3);
  ctx.bezierCurveTo(x - s * .5, y + s * .6, x, y + s * .8, x, y + s);
  ctx.bezierCurveTo(x, y + s * .8, x + s * .5, y + s * .6, x + s * .5, y + s * .3);
  ctx.bezierCurveTo(x + s * .5, y, x, y, x, y + s * .3); ctx.fill();
}
function bucle() {
  ctx.clearRect(0, 0, W, H);
  if (corazones && Math.random() < .04) particulas.push(nueva('corazon'));
  particulas = particulas.filter(p => {
    if (p.tipo === 'brillo') {
      p.fase += p.vel; p.y += p.vy; if (p.y < 0) p.y = H;
      ctx.globalAlpha = (Math.sin(p.fase) + 1) / 2 * .9; ctx.fillStyle = '#f7e2b5';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.fill(); return true;
    }
    if (p.tipo === 'corazon') {
      p.y += p.vy; p.osc += .02; ctx.globalAlpha = p.alfa; ctx.fillStyle = '#f4a7b9';
      dibujaCorazon(p.x + Math.sin(p.osc) * 20, p.y, p.r * 2); return p.y > -50;
    }
    p.vy += .18 * devicePixelRatio; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vida -= .006;
    ctx.globalAlpha = Math.max(p.vida, 0); ctx.fillStyle = p.color;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore();
    return p.vida > 0 && p.y < H + 40;
  });
  ctx.globalAlpha = 1; requestAnimationFrame(bucle);
}
bucle();
function explosion(x, y, n = 160) { for (let i = 0; i < n; i++) particulas.push(nueva('confeti', x * devicePixelRatio, y * devicePixelRatio)); }

// ---------- La historia ----------
const pasos = CONFIG.historia;
const fotosDe = p => p.foto ? [p.foto] : p.grupo || p.camino || [];
const tiemposDe = p => p.t || (p.puente ? CONFIG.tiempos.puente
  : p.foto ? (p.texto ? CONFIG.tiempos.foto : CONFIG.tiempos.fotoSinTexto)
  : fotosDe(p).length * CONFIG.tiempos.porFoto + 6);
// segundo (contado desde la primera escena) en que empieza cada una
const inicios = [0];
pasos.forEach(p => inicios.push(inicios[inicios.length - 1] + tiemposDe(p) * TIEMPO));
// precarga todas las fotos para que salgan sin esperas
pasos.forEach(p => fotosDe(p).forEach(f => { new Image().src = f; }));

const mesa = document.getElementById('mesa'), narrador = document.getElementById('narrador');
const puente = document.getElementById('puente'), cartelaPuente = puente.querySelector('.cartela');
const fondos = [document.getElementById('fondo0'), document.getElementById('fondo1')];
let fondoActivo = 0;
const azar = (a, b) => a + Math.random() * (b - a);

const musica = document.getElementById('musica'); musica.src = CONFIG.cancion;
let actual = -1, temporizador = null, pausado = false, inicioMusica = 0, vueltas = 0, timersPaso = [];
const musicaSuena = () => !musica.paused && musica.readyState >= 2;
const tiempoMusica = () => vueltas + musica.currentTime;
// Si la historia dura más que la canción, vuelve a empezarla sin perder el compás
musica.addEventListener('ended', () => {
  // redondea al tiempo más cercano para que la segunda vuelta siga cayendo en el golpe
  const total = vueltas + musica.duration;
  const desfase = (total - inicioMusica + CONFIG.primerTiempo) % TIEMPO;
  vueltas = total + (desfase > TIEMPO / 2 ? TIEMPO - desfase : -desfase);
  musica.currentTime = 0; musica.play().catch(() => {});
});

// Programa la siguiente escena usando el reloj de la canción (para que
// caiga justo en el golpe); sin música, usa un temporizador normal.
function programar() {
  let espera = inicios[actual + 1] - inicios[actual];
  if (musicaSuena()) espera = Math.max(.2, inicioMusica + inicios[actual + 1] - tiempoMusica());
  temporizador = setTimeout(siguiente, espera * 1000);
}

const despues = (seg, fn) => timersPaso.push(setTimeout(fn, seg * 1000));
// escribe el texto en una cartela letra a letra, como una máquina de escribir
function escribir(c, texto, desde) {
  const pTxt = c.querySelector('p'); pTxt.textContent = '';
  for (const ch of texto) { const sp = document.createElement('span'); sp.className = 'l'; sp.textContent = ch; pTxt.appendChild(sp); }
  c.classList.remove('ver', 'sale'); void c.offsetWidth; c.classList.add('ver');
  const letras = [...pTxt.children], paso = Math.min(.04, 1.8 / letras.length); // nunca tarda más de ~1,8 s
  letras.forEach((l, k) => despues(desde + .25 + k * paso, () => l.classList.add('on')));
}
function completar() {
  document.querySelectorAll('#viaje .l').forEach(n => n.classList.add('on'));
  document.querySelectorAll('#mesa .sello').forEach(n => n.classList.add('ver'));
}
function ponerFondo(src) {
  fondos[fondoActivo].classList.remove('on');
  if (!src) return;
  fondoActivo ^= 1;
  fondos[fondoActivo].style.backgroundImage = `url("${src}")`;
  fondos[fondoActivo].classList.add('on');
}
function imagen(src, rot) {
  const im = document.createElement('img'); im.className = 'foto'; im.alt = ''; im.src = src;
  im.style.setProperty('--rot', rot.toFixed(1) + 'deg');
  return im;
}

function mostrar(i) {
  timersPaso.forEach(clearTimeout); timersPaso = [];
  document.querySelectorAll('#viaje .l').forEach(n => n.classList.add('on')); // termina la frase anterior
  const p = pasos[i], dura = tiemposDe(p) * TIEMPO;
  // la escena anterior se desvanece
  [...mesa.children].forEach(c => { c.classList.add('sale'); setTimeout(() => c.remove(), 1300); });

  if (p.puente) {
    narrador.classList.remove('ver'); narrador.classList.add('sale'); ponerFondo(null);
    puente.classList.add('on'); escribir(cartelaPuente, p.puente, .3);
    return;
  }
  puente.classList.remove('on');
  const esc = document.createElement('div');

  if (p.foto) {
    esc.className = 'esc unica';
    const pieza = document.createElement('div'); pieza.className = 'pieza';
    pieza.style.setProperty('--rot', (p.destacar ? azar(-1.5, 1.5) : azar(-4, 4)).toFixed(1) + 'deg');
    pieza.appendChild(imagen(p.foto, 0));
    if (p.sello) {
      const se = document.createElement('div'); se.className = 'sello'; se.textContent = p.sello; pieza.appendChild(se);
      despues(COMPAS * 1.5, () => se.classList.add('ver'));
    }
    esc.appendChild(pieza);
    if (p.destacar) {
      pieza.classList.add('destacada');
      requestAnimationFrame(() => requestAnimationFrame(() => pieza.classList.add('lista')));
    } else pieza.classList.add('cae');
  } else if (p.grupo) {
    // varias fotos a la vez: van apareciendo una tras otra, al ritmo
    esc.className = 'esc grupo n' + Math.min(p.grupo.length, 4);
    p.grupo.forEach((src, k) => {
      const celda = document.createElement('div'); celda.className = 'celda';
      const im = imagen(src, azar(-3, 3)); celda.appendChild(im); esc.appendChild(celda);
      despues(k * CONFIG.tiempos.porFoto * TIEMPO, () => im.classList.add('cae'));
    });
  } else if (p.camino) {
    // todas en un plano, en zigzag: fila a la derecha, la siguiente a la izquierda…
    esc.className = 'esc camino';
    const W = mesa.clientWidth, H = mesa.clientHeight, n = p.camino.length;
    const cols = W / H > 1 ? 4 : 3, filas = Math.ceil(n / cols), cw = W / cols, ch = H / filas;
    const puntos = p.camino.map((src, k) => {
      const fila = Math.floor(k / cols), enFila = k % cols;
      const col = fila % 2 ? cols - 1 - enFila : enFila;
      return [(col + .5) * cw, (fila + .5) * ch];
    });
    esc.innerHTML = `<svg><polyline points="${puntos.map(q => q.join(',')).join(' ')}"/></svg>`;
    p.camino.forEach((src, k) => {
      const paso = document.createElement('div'); paso.className = 'paso';
      paso.style.left = puntos[k][0] + 'px'; paso.style.top = puntos[k][1] + 'px';
      const im = imagen(src, azar(-5, 5));
      im.style.maxWidth = (cw - 14) + 'px'; im.style.maxHeight = (ch - 12) + 'px';
      paso.appendChild(im); esc.appendChild(paso);
      despues(k * CONFIG.tiempos.porFoto * TIEMPO, () => im.classList.add('cae'));
    });
  }
  mesa.appendChild(esc);
  ponerFondo(fotosDe(p)[0]);

  // la frase (o frases) de la escena; si no hay, se queda la anterior
  const textos = p.textos || (p.texto ? [p.texto] : []);
  textos.forEach((t, k) => despues(k * dura / textos.length, () => escribir(narrador, t, k ? 0 : .3)));
}
function siguiente() {
  actual++;
  if (actual >= pasos.length) return terminar();
  mostrar(actual);
  programar();
}
function terminar() {
  document.getElementById('final').classList.add('activo');
  corazones = true;
  [0, 700, 1400].forEach(t => setTimeout(() => explosion(innerWidth * (.25 + Math.random() * .5), innerHeight * .4), t));
  // baja la música poco a poco
  const fade = setInterval(() => { musica.volume = Math.max(0, musica.volume - .02); if (musica.volume <= .3) clearInterval(fade); }, 120);
}

document.getElementById('empezar').addEventListener('click', e => {
  explosion(e.clientX, e.clientY);
  musica.volume = 1; musica.currentTime = 0; vueltas = 0; musica.play().catch(() => {});
  document.getElementById('inicio').classList.add('salir');
  // el primer paso entra justo al empezar el segundo compás
  inicioMusica = CONFIG.primerTiempo + COMPAS;
  setTimeout(() => { corazones = false; document.getElementById('viaje').classList.add('activo'); siguiente(); }, inicioMusica * 1000);
});
document.getElementById('btnPausa').addEventListener('click', e => {
  pausado = !pausado;
  e.currentTarget.textContent = pausado ? '▶' : '❚❚';
  if (pausado) { clearTimeout(temporizador); timersPaso.forEach(clearTimeout); timersPaso = []; completar(); musica.pause(); }
  else { musica.play().then(programar, programar); }
});
document.getElementById('btnSonido').addEventListener('click', e => {
  musica.muted = !musica.muted; e.currentTarget.textContent = musica.muted ? '🔇' : '🔊';
});
document.getElementById('otraVez').addEventListener('click', () => {
  document.getElementById('final').classList.remove('activo');
  clearTimeout(temporizador); actual = -1; corazones = false; mesa.innerHTML = '';
  narrador.classList.remove('ver'); ponerFondo(null);
  musica.volume = 1; musica.currentTime = 0; vueltas = 0; inicioMusica = CONFIG.primerTiempo;
  musica.play().then(() => setTimeout(siguiente, CONFIG.primerTiempo * 1000), siguiente);
});
</script>
</body>
</html>
