<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Feliz 60, Mamá!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Lato:wght@300;400&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --oro: #e8c27a;
    --oro-claro: #f7e2b5;
    --rosa: #f4a7b9;
    --noche: #0b1626;
    --noche-2: #1d3554;
    --texto: #fff8ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at top, var(--noche-2), var(--noche) 70%);
    color: var(--texto);
    font-family: 'Lato', sans-serif;
  }
  canvas#fx { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

  /* ---------- Pantalla de inicio ---------- */
  #inicio {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 24px 16px; z-index: 10; transition: opacity 1.2s ease, transform 1.2s ease;
  }
  #inicio.salir { opacity: 0; transform: scale(1.08); pointer-events: none; }
  .saludo {
    font-family: 'Great Vibes', cursive; font-size: clamp(2.6rem, 9vw, 5.5rem);
    color: var(--oro-claro); text-shadow: 0 0 24px rgba(232,194,122,.45);
    opacity: 0; animation: aparecer 1.6s .3s forwards;
  }
  .sesenta {
    font-family: 'Playfair Display', serif; font-weight: 700;
    font-size: clamp(7rem, 30vw, 15rem); line-height: 1;
    background: linear-gradient(120deg, #b8862f, var(--oro-claro) 40%, #fff 50%, var(--oro-claro) 60%, #b8862f);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    opacity: 0; animation: aparecer 1.6s .9s forwards, brillo 5s 2s linear infinite;
    filter: drop-shadow(0 6px 30px rgba(232,194,122,.35));
  }
  .subtitulo {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: clamp(1.05rem, 3.6vw, 1.5rem); max-width: 34ch; margin-top: 10px;
    opacity: 0; animation: aparecer 1.6s 1.6s forwards; color: #eef3fa;
  }
  #empezar {
    margin-top: 42px; position: relative; border: none; cursor: pointer;
    font-family: 'Playfair Display', serif; font-size: 1.2rem; letter-spacing: .04em;
    color: var(--noche); padding: 18px 40px; border-radius: 999px;
    background: linear-gradient(135deg, var(--oro-claro), var(--oro) 50%, var(--rosa));
    box-shadow: 0 10px 40px rgba(244,167,185,.35), inset 0 -3px 0 rgba(0,0,0,.12);
    opacity: 0; animation: aparecer 1.2s 2.4s forwards, latido 2.4s 3.6s ease-in-out infinite;
    transition: transform .25s ease;
    overflow: hidden;
  }
  #empezar::before {
    content: ''; position: absolute; inset: -6px; border-radius: inherit; z-index: -1;
    border: 2px solid var(--oro); opacity: .6; animation: onda 2.4s 3.6s ease-out infinite;
  }
  #empezar::after {
    content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent);
    transform: skewX(-20deg); animation: destello 3.5s 4s ease-in-out infinite;
  }
  #empezar:hover { transform: scale(1.06); }
  #empezar:active { transform: scale(.97); }
  .pista { margin-top: 18px; font-size: .85rem; opacity: 0; animation: aparecer 1s 3.2s forwards; color: #b9c6d8; }

  @keyframes aparecer { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes brillo { to { background-position: -250% 0; } }
  @keyframes latido { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes onda { from { transform: scale(1); opacity: .7; } to { transform: scale(1.35); opacity: 0; } }
  @keyframes destello { 0%,60% { left: -60%; } 100% { left: 130%; } }

  /* ---------- Viaje: escenas tipo historieta ---------- */
  #viaje { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 1.5s ease; }
  #viaje.activo { opacity: 1; pointer-events: auto; }
  .escena { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; overflow: hidden; }
  .escena.visible { opacity: 1; }
  .fondo {
    position: absolute; inset: -40px; background-size: cover; background-position: center;
    filter: blur(28px) brightness(.4);
  }
  .fondo.azul { inset: 0; filter: none; background: radial-gradient(ellipse at 50% 30%, var(--noche-2), var(--noche) 75%); }
  /* trama de puntos, como el papel de los cómics */
  .trama { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 1.2px, transparent 1.6px); background-size: 7px 7px; }

  .zona { position: absolute; left: 0; right: 0; top: 64px; bottom: 210px; }
  .zona.unica { display: flex; align-items: center; justify-content: center; padding: 0 16px; }
  .polaroid {
    position: relative; background: #fffdf7; padding: 9px 9px 30px; opacity: 0;
    box-shadow: 0 18px 40px rgba(0,0,0,.55); transform: rotate(var(--rot, 0deg));
  }
  .marco { overflow: hidden; }
  .polaroid img { display: block; max-width: min(84vw, 560px); max-height: calc(100vh - 340px); object-fit: contain; }
  .collage .polaroid img { max-width: min(50vw, 300px); max-height: 25vh; }
  .collage .pos { position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%); }
  .escena.visible .zona.unica .polaroid, .pos.cae .polaroid { animation: aterriza .75s cubic-bezier(.2,.9,.3,1.2) forwards; }
  .escena.visible .zona.unica .polaroid img { animation: kenburns 8s 0.6s ease-out forwards; }
  @keyframes aterriza {
    0% { opacity: 0; transform: rotate(calc(var(--rot, 0deg) + 14deg)) scale(1.6); }
    60% { opacity: 1; transform: rotate(var(--rot, 0deg)) scale(.95); }
    100% { opacity: 1; transform: rotate(var(--rot, 0deg)) scale(1); }
  }
  @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.07); } }
  .sin-foto { width: min(70vw, 420px); height: 30vh; display: flex; align-items: center; justify-content: center; text-align: center; color: #555; font-size: .9rem; }

  /* sello de pasaporte (guiño a un viaje) */
  .sello {
    position: absolute; right: -10px; top: 18px; padding: 6px 12px; border: 3px double #c0392b; border-radius: 6px;
    color: #c0392b; font-family: 'Playfair Display', serif; font-weight: 700; letter-spacing: .12em; font-size: 1.05rem;
    background: rgba(255,253,247,.75); opacity: 0; transform: rotate(-14deg);
  }
  .sello.ver { animation: sellar .35s ease-in forwards; }
  @keyframes sellar { from { opacity: 0; transform: rotate(-14deg) scale(3); } to { opacity: .9; transform: rotate(-14deg) scale(1); } }

  /* cartela de narrador, como en las viñetas */
  .cartela {
    position: absolute; left: 16px; right: 16px; bottom: 62px; max-width: 520px; margin: 0 auto;
    background: #fff6d8; color: #1a2232; border: 3px solid #111; box-shadow: 6px 6px 0 #111;
    padding: 12px 16px; opacity: 0; transform: rotate(-1.2deg);
  }
  .cartela p { font-family: 'Caveat', cursive; font-weight: 600; font-size: clamp(1.4rem, 5.4vw, 1.85rem); line-height: 1.2; }
  .cartela.ver { animation: vineta .45s cubic-bezier(.2,.9,.3,1.4) forwards; }
  @keyframes vineta { from { opacity: 0; transform: rotate(-1.2deg) scale(.4); } to { opacity: 1; transform: rotate(-1.2deg) scale(1); } }
  .l { opacity: 0; transition: opacity .12s; }
  .l.on { opacity: 1; }

  /* portada de capítulo */
  .cap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 16px; }
  .cap .num { font-family: 'Lato', sans-serif; letter-spacing: .45em; text-transform: uppercase; font-size: .85rem; color: var(--oro); opacity: 0; }
  .cap .titulo { font-family: 'Great Vibes', cursive; font-size: clamp(3rem, 14vw, 5.2rem); color: var(--oro-claro); line-height: 1.1; margin-top: 8px; }
  .cap .titulo span { display: inline-block; opacity: 0; margin: 0 .12em; }
  .cap .raya { width: 0; height: 2px; margin-top: 14px; background: linear-gradient(90deg, transparent, var(--oro), transparent); }
  .escena.visible .cap .num { animation: aparecer .8s forwards; }
  .escena.visible .cap .titulo span { animation: pop .5s cubic-bezier(.2,.9,.3,1.5) forwards; }
  .escena.visible .cap .raya { animation: raya 1.2s .9s ease-out forwards; }
  @keyframes pop { from { opacity: 0; transform: scale(.3) rotate(-8deg); } to { opacity: 1; transform: none; } }
  @keyframes raya { to { width: min(60vw, 280px); } }

  /* Barra de progreso tipo línea de vida */
  #linea { position: fixed; left: 16px; right: 16px; bottom: 22px; height: 3px; background: rgba(255,255,255,.18); border-radius: 3px; z-index: 6; }
  #linea .avance { height: 100%; width: 0; background: linear-gradient(90deg, var(--rosa), var(--oro)); border-radius: 3px; transition: width .6s ease; }
  #linea .punto { position: absolute; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: rgba(255,255,255,.35); transition: background .4s, transform .4s; }
  #linea .punto.hecho { background: var(--oro); transform: scale(1.3); }

  .controles { position: fixed; top: 14px; right: 14px; z-index: 7; display: flex; gap: 8px; }
  .controles button {
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3);
    background: rgba(11,22,38,.55); color: var(--texto); font-size: 1.1rem; cursor: pointer; backdrop-filter: blur(6px);
  }

  /* ---------- Final ---------- */
  #final {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px 16px; opacity: 0; pointer-events: none; transition: opacity 2s ease; z-index: 8;
    background: radial-gradient(ellipse at center, rgba(29,53,84,.92), rgba(11,22,38,.98));
  }
  #final.activo { opacity: 1; pointer-events: auto; }
  #final h2 { font-family: 'Great Vibes', cursive; font-weight: 400; font-size: clamp(2.6rem, 9vw, 5rem); color: var(--oro-claro); }
  #final p { font-family: 'Playfair Display', serif; font-style: italic; font-size: clamp(1.05rem, 3.6vw, 1.4rem); max-width: 36ch; margin-top: 14px; line-height: 1.5; }
  #final .firma { font-family: 'Great Vibes', cursive; font-size: 2rem; color: var(--rosa); margin-top: 18px; font-style: normal; }
  #final .continuara { font-family: 'Caveat', cursive; font-size: 1.9rem; color: var(--oro); margin-top: 10px; opacity: 0; transform: rotate(-4deg); }
  #final.activo .continuara { animation: aparecer 1s 2.2s forwards; }
  #otraVez { margin-top: 34px; background: transparent; border: 1px solid var(--oro); color: var(--oro-claro); padding: 12px 28px; border-radius: 999px; font-family: 'Lato', sans-serif; cursor: pointer; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<canvas id="fx"></canvas>

<section id="inicio">
  <div class="saludo">¡Felicidades, Mamá!</div>
  <div class="sesenta">60</div>
  <p class="subtitulo">Sesenta años llenando de luz todo lo que tocas</p>
  <button id="empezar">✨ Comienza el viaje ✨</button>
  <div class="pista">Sube el volumen 🎶</div>
</section>

<section id="viaje">
  <div id="diapos"></div>
  <div id="linea"><div class="avance"></div></div>
  <div class="controles">
    <button id="btnPausa" title="Pausar">❚❚</button>
    <button id="btnSonido" title="Silenciar">🔊</button>
  </div>
</section>

<section id="final">
  <h2>¡Feliz cumpleaños!</h2>
  <p id="mensajeFinal"></p>
  <p class="firma" id="firma"></p>
  <p class="continuara">Continuará…</p>
  <button id="otraVez">↺ Ver de nuevo</button>
</section>

<audio id="musica" preload="auto"></audio>

<script>
/* =====================================================================
   PERSONALIZA AQUÍ
   - Fotos en "fotos/" y la canción en "musica/".
   - La historia es una lista de escenas, de tres tipos:
       { capitulo: 'Capítulo 1', titulo: '...' }        portada de capítulo
       { foto: 'fotos/x.jpg', texto: '...', sello: '' }  una foto con su cartela
       { collage: ['fotos/a.jpg', ...], texto: '...' }    varias fotos seguidas
   - Todo va al ritmo de la canción (138 bpm): cada escena dura un número
     de compases (4 tiempos ≈ 1,74 s) y en los collages cae una foto por compás.
   ===================================================================== */
const CONFIG = {
  cancion: 'musica/cancion.mp3', // Viva la Vida - Coldplay
  bpm: 138,
  primerTiempo: 0.785, // segundo exacto del primer golpe de la canción
  compases: { capitulo: 2, foto: 4, collageExtra: 4 },
  mensajeFinal: 'Gracias por cada abrazo, cada consejo y cada sonrisa. Todo lo bonito que tenemos empezó contigo. Te queremos muchísimo.',
  firma: 'Tu familia',
  historia: [
    { capitulo: 'Capítulo 1', titulo: 'Los primeros años' },
    { foto: 'fotos/bebe-mama.jpg', texto: 'Llegaste a una familia que te quiere con locura.' },
    { foto: 'fotos/con-papa.jpg', texto: 'Un padre con dos hijas preciosas.' },
    { foto: 'fotos/con-mama.jpg', texto: 'Una madre con cariño infinito.' },
    { foto: 'fotos/infancia.jpg', texto: 'Con una hermana que te cuida mucho.' },

    { capitulo: 'Capítulo 2', titulo: 'La juventud' },
    { collage: ['fotos/mirador.jpg', 'fotos/acantilado.jpg', 'fotos/banco.jpg', 'fotos/fiesta.jpg'],
      texto: 'Y fuiste creciendo y conociendo a nuevas personas. Viviendo nuevas experiencias, pero siempre siendo tú.' },
    { foto: 'fotos/paris.jpg', texto: 'Y ese famoso viaje inesperado a París…', sello: 'PARÍS ✈' },

    { capitulo: 'Capítulo 3', titulo: 'El amor' },
    { foto: 'fotos/novia.jpg', texto: 'Esa mirada… que nos enamora a todos.' },
    { foto: 'fotos/boda.jpg', texto: 'El día en que empezó todo lo que hoy somos.' },
    { foto: 'fotos/brindis.jpg', texto: 'Brindasteis por lo que vendría… y mira todo lo que habéis construido.' },

    { capitulo: 'Capítulo 4', titulo: 'Mamá' },
    { foto: 'fotos/bebe2.jpg', texto: 'De repente llegó una pajarito para convertirse en el centro del cariño.' },
    { foto: 'fotos/bebe.jpg', texto: 'Y apareció un regordete… En tus brazos, el mejor lugar del mundo.' },
    { foto: 'fotos/mama.jpg', texto: 'Entre flores y abrazos nos enseñaste lo que es el cariño.' },

    { capitulo: 'Capítulo 5', titulo: 'Mil aventuras' },
    { collage: ['fotos/reforma.jpg', 'fotos/menorca.jpg', 'fotos/escapada.jpg'],
      texto: 'Obras, viajes, escapadas… contigo cualquier plan se convierte en aventura.' },
    { foto: 'fotos/comida-familiar.jpg', texto: 'Porque donde estás tú, siempre hay sitio para uno más.' },
    { foto: 'fotos/boda-familia.jpg', texto: 'Emocionada viendo a tu sobrino Álex dar el «sí, quiero».' },
    { foto: 'fotos/los-cuatro.jpg', texto: 'Lo mejor que has construido y lo más bonito que tenemos.' },
    { foto: 'fotos/abrazo.jpg', texto: 'Dani ya no cabe en tus brazos, pero sigue buscando tus abrazos como el primer día.' },
    { foto: 'fotos/hoy.jpg', texto: '60 años… y lo mejor todavía está por llegar.' }
  ]
};
/* ===================================================================== */

const TIEMPO = 60 / CONFIG.bpm, COMPAS = TIEMPO * 4; // segundos por tiempo y por compás

document.getElementById('mensajeFinal').textContent = CONFIG.mensajeFinal;
document.getElementById('firma').textContent = CONFIG.firma ? '— ' + CONFIG.firma : '';

// ---------- Partículas: brillos dorados, corazones y confeti ----------
const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
let W, H, particulas = [];
function ajustar() { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; }
addEventListener('resize', ajustar); ajustar();
const colores = ['#e8c27a', '#f7e2b5', '#f4a7b9', '#ffffff', '#9fc3ea'];
function nueva(tipo, x, y) {
  const d = devicePixelRatio;
  if (tipo === 'brillo') return { tipo, x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.8 + .4) * d, fase: Math.random() * 6.28, vel: Math.random() * .03 + .01, vy: -(Math.random() * .2 + .05) * d };
  if (tipo === 'corazon') return { tipo, x: Math.random() * W, y: H + 20 * d, r: (Math.random() * 8 + 6) * d, vy: -(Math.random() * .7 + .4) * d, osc: Math.random() * 6.28, alfa: Math.random() * .4 + .25 };
  const ang = Math.random() * 6.28, v = (Math.random() * 9 + 4) * d;
  return { tipo: 'confeti', x, y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v - 5 * d, r: (Math.random() * 4 + 3) * d, rot: Math.random() * 6.28, vr: Math.random() * .3 - .15, color: colores[Math.random() * colores.length | 0], vida: 1 };
}
for (let i = 0; i < 90; i++) particulas.push(nueva('brillo'));
let corazones = true;
function dibujaCorazon(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * .3);
  ctx.bezierCurveTo(x, y, x - s * .5, y, x - s * .5, y + s * .3);
  ctx.bezierCurveTo(x - s * .5, y + s * .6, x, y + s * .8, x, y + s);
  ctx.bezierCurveTo(x, y + s * .8, x + s * .5, y + s * .6, x + s * .5, y + s * .3);
  ctx.bezierCurveTo(x + s * .5, y, x, y, x, y + s * .3); ctx.fill();
}
function bucle() {
  ctx.clearRect(0, 0, W, H);
  if (corazones && Math.random() < .04) particulas.push(nueva('corazon'));
  particulas = particulas.filter(p => {
    if (p.tipo === 'brillo') {
      p.fase += p.vel; p.y += p.vy; if (p.y < 0) p.y = H;
      ctx.globalAlpha = (Math.sin(p.fase) + 1) / 2 * .9; ctx.fillStyle = '#f7e2b5';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.fill(); return true;
    }
    if (p.tipo === 'corazon') {
      p.y += p.vy; p.osc += .02; ctx.globalAlpha = p.alfa; ctx.fillStyle = '#f4a7b9';
      dibujaCorazon(p.x + Math.sin(p.osc) * 20, p.y, p.r * 2); return p.y > -50;
    }
    p.vy += .18 * devicePixelRatio; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vida -= .006;
    ctx.globalAlpha = Math.max(p.vida, 0); ctx.fillStyle = p.color;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore();
    return p.vida > 0 && p.y < H + 40;
  });
  ctx.globalAlpha = 1; requestAnimationFrame(bucle);
}
bucle();
function explosion(x, y, n = 160) { for (let i = 0; i < n; i++) particulas.push(nueva('confeti', x * devicePixelRatio, y * devicePixelRatio)); }

// ---------- Escenas ----------
const cont = document.getElementById('diapos'), linea = document.getElementById('linea');
const tipo = e => e.capitulo ? 'capitulo' : e.collage ? 'collage' : 'foto';
const compasesDe = e => tipo(e) === 'capitulo' ? CONFIG.compases.capitulo
  : tipo(e) === 'collage' ? e.collage.length + CONFIG.compases.collageExtra : CONFIG.compases.foto;
// segundo (contado desde la primera escena) en que empieza cada escena
const inicios = [0];
CONFIG.historia.forEach(e => inicios.push(inicios[inicios.length - 1] + compasesDe(e) * COMPAS));

// posiciones de las fotos en los collages (x, y, giro)
const HUECOS = {
  2: [[30, 38, -6], [70, 58, 5]],
  3: [[30, 27, -6], [70, 42, 5], [36, 75, 3]],
  4: [[29, 25, -7], [71, 30, 6], [31, 72, 5], [70, 74, -4]],
  5: [[28, 22, -7], [72, 26, 6], [50, 50, -2], [28, 78, 5], [72, 76, -4]]
};
const giro = () => (Math.random() * 6 - 3).toFixed(1) + 'deg';

function polaroid(src, rot) {
  const p = document.createElement('div'); p.className = 'polaroid'; p.style.setProperty('--rot', rot);
  p.innerHTML = '<div class="marco"><img alt=""></div>';
  const img = p.querySelector('img');
  img.onerror = () => { p.querySelector('.marco').innerHTML = `<div class="sin-foto">📷 Falta la foto<br>${src}</div>`; };
  img.src = src;
  return p;
}
function cartela(texto) {
  const c = document.createElement('div'); c.className = 'cartela';
  const pTxt = document.createElement('p');
  // cada letra en su <span> para escribirla como una máquina sin mover el texto
  for (const ch of texto) { const sp = document.createElement('span'); sp.className = 'l'; sp.textContent = ch; pTxt.appendChild(sp); }
  c.appendChild(pTxt); return c;
}

CONFIG.historia.forEach((e, i) => {
  const d = document.createElement('div'); d.className = 'escena ' + tipo(e);
  if (tipo(e) === 'capitulo') {
    d.innerHTML = '<div class="fondo azul"></div><div class="trama"></div><div class="cap"><div class="num"></div><div class="titulo"></div><div class="raya"></div></div>';
    d.querySelector('.num').textContent = e.capitulo;
    e.titulo.split(' ').forEach((pal, k) => {
      const sp = document.createElement('span'); sp.textContent = pal; sp.style.animationDelay = (.35 + k * .22) + 's';
      d.querySelector('.titulo').appendChild(sp);
    });
  } else if (tipo(e) === 'collage') {
    d.innerHTML = '<div class="fondo azul"></div><div class="trama"></div><div class="zona"></div>';
    const huecos = HUECOS[e.collage.length] || HUECOS[5];
    e.collage.forEach((src, k) => {
      const [x, y, r] = huecos[k % huecos.length];
      const pos = document.createElement('div'); pos.className = 'pos';
      pos.style.setProperty('--x', x + '%'); pos.style.setProperty('--y', y + '%');
      pos.appendChild(polaroid(src, r + 'deg'));
      d.querySelector('.zona').appendChild(pos);
    });
    d.appendChild(cartela(e.texto));
  } else {
    d.innerHTML = '<div class="fondo"></div><div class="trama"></div><div class="zona unica"></div>';
    const p = polaroid(e.foto, giro());
    p.querySelector('img').addEventListener('load', () => { d.querySelector('.fondo').style.backgroundImage = `url("${e.foto}")`; });
    if (e.sello) { const se = document.createElement('div'); se.className = 'sello'; se.textContent = e.sello; p.appendChild(se); }
    d.querySelector('.zona').appendChild(p);
    d.appendChild(cartela(e.texto));
  }
  cont.appendChild(d);
  const pt = document.createElement('div'); pt.className = 'punto';
  pt.style.left = (CONFIG.historia.length > 1 ? i / (CONFIG.historia.length - 1) * 100 : 0) + '%';
  linea.appendChild(pt);
});
const escenas = [...cont.children], puntos = [...linea.querySelectorAll('.punto')];

const musica = document.getElementById('musica'); musica.src = CONFIG.cancion;
let actual = -1, temporizador = null, pausado = false, inicioMusica = 0, vueltas = 0, timersEscena = [];
const musicaSuena = () => !musica.paused && musica.readyState >= 2;
const tiempoMusica = () => vueltas + musica.currentTime;
// Si la historia dura más que la canción, vuelve a empezarla sin perder el compás
musica.addEventListener('ended', () => {
  // redondea al tiempo más cercano para que la segunda vuelta siga cayendo en el golpe
  const total = vueltas + musica.duration;
  const desfase = (total - inicioMusica + CONFIG.primerTiempo) % TIEMPO;
  vueltas = total + (desfase > TIEMPO / 2 ? TIEMPO - desfase : -desfase);
  musica.currentTime = 0; musica.play().catch(() => {});
});

// Programa la siguiente escena usando el reloj de la canción (para que
// caiga justo en el compás); sin música, usa un temporizador normal.
function programar() {
  let espera = inicios[actual + 1] - inicios[actual];
  if (musicaSuena()) espera = Math.max(.3, inicioMusica + inicios[actual + 1] - tiempoMusica());
  temporizador = setTimeout(siguiente, espera * 1000);
}

const despues = (seg, fn) => timersEscena.push(setTimeout(fn, seg * 1000));
function escribir(d, desde) {
  const c = d.querySelector('.cartela'); if (!c) return;
  const letras = [...c.querySelectorAll('.l')];
  despues(desde, () => c.classList.add('ver'));
  const paso = Math.min(.045, 3.2 / letras.length); // nunca tarda más de ~3 s en escribirse
  letras.forEach((l, k) => despues(desde + .4 + k * paso, () => l.classList.add('on')));
}
function reiniciar(d) {
  d.querySelectorAll('.cae, .ver, .on').forEach(n => n.classList.remove('cae', 'ver', 'on'));
}
function completar(d) {
  d.querySelectorAll('.pos').forEach(n => n.classList.add('cae'));
  d.querySelectorAll('.cartela, .sello').forEach(n => n.classList.add('ver'));
  d.querySelectorAll('.l').forEach(n => n.classList.add('on'));
}

function mostrar(i) {
  timersEscena.forEach(clearTimeout); timersEscena = [];
  const d = escenas[i]; reiniciar(d); void d.offsetWidth; // reinicia las animaciones
  escenas.forEach((x, j) => x.classList.toggle('visible', j === i));
  puntos.forEach((p, j) => p.classList.toggle('hecho', j <= i));
  linea.querySelector('.avance').style.width = (escenas.length > 1 ? i / (escenas.length - 1) * 100 : 100) + '%';
  const e = CONFIG.historia[i];
  if (tipo(e) === 'collage') {
    // una foto por compás, cayendo justo en el golpe
    d.querySelectorAll('.pos').forEach((pos, k) => despues(k * COMPAS, () => pos.classList.add('cae')));
    escribir(d, .8);
  } else if (tipo(e) === 'foto') {
    escribir(d, .7);
    despues(COMPAS * 1.5, () => d.querySelector('.sello')?.classList.add('ver'));
  }
}
function siguiente() {
  actual++;
  if (actual >= escenas.length) return terminar();
  mostrar(actual);
  programar();
}
function terminar() {
  document.getElementById('final').classList.add('activo');
  corazones = true;
  [0, 700, 1400].forEach(t => setTimeout(() => explosion(innerWidth * (.25 + Math.random() * .5), innerHeight * .4), t));
  // baja la música poco a poco
  const fade = setInterval(() => { musica.volume = Math.max(0, musica.volume - .02); if (musica.volume <= .3) clearInterval(fade); }, 120);
}

document.getElementById('empezar').addEventListener('click', e => {
  explosion(e.clientX, e.clientY);
  musica.volume = 1; musica.currentTime = 0; vueltas = 0; musica.play().catch(() => {});
  document.getElementById('inicio').classList.add('salir');
  // la primera foto entra justo al empezar el segundo compás
  inicioMusica = CONFIG.primerTiempo + COMPAS;
  setTimeout(() => { corazones = false; document.getElementById('viaje').classList.add('activo'); siguiente(); }, inicioMusica * 1000);
});
document.getElementById('btnPausa').addEventListener('click', e => {
  pausado = !pausado;
  e.currentTarget.textContent = pausado ? '▶' : '❚❚';
  if (pausado) { clearTimeout(temporizador); timersEscena.forEach(clearTimeout); timersEscena = []; if (escenas[actual]) completar(escenas[actual]); musica.pause(); }
  else { musica.play().then(programar, programar); }
});
document.getElementById('btnSonido').addEventListener('click', e => {
  musica.muted = !musica.muted; e.currentTarget.textContent = musica.muted ? '🔇' : '🔊';
});
document.getElementById('otraVez').addEventListener('click', () => {
  document.getElementById('final').classList.remove('activo');
  clearTimeout(temporizador); actual = -1; corazones = false;
  musica.volume = 1; musica.currentTime = 0; vueltas = 0; inicioMusica = CONFIG.primerTiempo;
  musica.play().then(() => setTimeout(siguiente, CONFIG.primerTiempo * 1000), siguiente);
});
</script>
</body>
</html>
